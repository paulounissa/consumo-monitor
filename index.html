<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Consumo e Emissões</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Calculadora de Operações</h2>
            <p>Monitore o consumo, custo e pegada de carbono</p>
        </div>
        
        <div class="form-group">
            <label for="modelo">Selecione o Equipamento:</label>
            <select id="modelo">
                <optgroup label="Linha Amarela (Cálculo por Hora)">
                    <option value="minicarregadeira_sr175b">Minicarregadeira CASE SR175B</option>
                    <option value="retroescavadeira_580n">Retroescavadeira CASE 580N</option>
                    <option value="motoniveladora_865b">Motoniveladora Case 865B</option>
                    <option value="escavadeira_cat320">Escavadeira Hidráulica CAT 320</option>
                    <option value="pa_carregadeira_l120h">Pá Carregadeira Volvo L120H</option>
                    <option value="retroescavadeira_3cx">Retroescavadeira JCB 3CX</option>
                    <option value="minicarregadeira_s530">Minicarregadeira Bobcat S530</option>
                    <option value="rolo_compactador_ca250">Rolo Compactador Dynapac CA250</option>
                </optgroup>
                <optgroup label="Transporte (Cálculo por Km)">
                    <option value="caminhao_vw24280">Caminhão VW 24.280 Basculante</option>
                    <option value="caminhao_atego2730">Caminhão MB Atego 2730 Basculante</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label id="label-quantidade" for="quantidade">Horas Trabalhadas (h):</label>
            <input type="number" id="quantidade" placeholder="Ex: 8" step="0.1" min="0">
        </div>

        <div class="form-group">
            <label for="preco-diesel">Preço do Diesel S10 (R$/L):</label>
            <input type="number" id="preco-diesel" placeholder="Ex: 5.90" step="0.01" min="0">
        </div>

        <div id="msg-erro" class="erro oculto">Por favor, preencha os valores corretamente.</div>

        <button class="btn-primary" onclick="calcular()">Calcular Impacto</button>

        <div id="resultados" class="resultados oculto">
            <h3>Relatório Operacional</h3>
            <div class="grid-resultados">
                <div class="card-dado">
                    <span class="dado-titulo">Combustível</span>
                    <span class="dado-valor"><span id="res-litros">0</span> L</span>
                </div>
                <div class="card-dado destaque">
                    <span class="dado-titulo">Custo Total</span>
                    <span class="dado-valor"><span id="res-custo">R$ 0,00</span></span>
                </div>
                <div class="card-dado eco">
                    <span class="dado-titulo">Emissão CO₂</span>
                    <span class="dado-valor"><span id="res-co2">0</span> kg</span>
                </div>
            </div>
        </div>

        <button id="btn-exportar" class="btn-secondary oculto" onclick="exportarCSV()">
            ⬇️ Exportar Relatório (CSV)
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
